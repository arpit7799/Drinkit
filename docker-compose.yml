services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drinkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drinkit_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-drinkit}
    ports:
      - "5432:5432"
    volumes:
      - drinkit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  drinkit_postgres_data:
