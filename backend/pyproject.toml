[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # allow FastAPI's Depends() in default arguments

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = "venv|alembic/versions"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
skip = ["venv", "alembic/versions"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["venv", "alembic/versions"]